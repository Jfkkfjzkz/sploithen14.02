<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SploitHen 14.02</title>
    <style>

:root {
  color-scheme: dark;
  --bg:#050b18; --panel:rgba(10,22,43,.88); --panel2:rgba(7,17,35,.94);
  --line:rgba(75,166,255,.22); --fg:#dcecff; --bright:#f5faff;
  --dim:#8ca9c9; --faint:#55718f; --blue:#299cff; --cyan:#55d8ff;
  --ok:#55e6b0; --bad:#ff7e91; --warn:#ffd27a;
  --sans: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); }
body {
  min-height:100vh; overflow:hidden; position:relative;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(22,112,210,.24), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(0,190,255,.10), transparent 45%),
    linear-gradient(145deg,#050a16 0%,#07152a 52%,#040914 100%);
}
body:before,body:after { content:""; position:fixed; pointer-events:none; z-index:0; }
body:before {
  inset:0; opacity:.24;
  background-image:linear-gradient(rgba(80,160,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,160,255,.07) 1px,transparent 1px);
  background-size:42px 42px; mask-image:linear-gradient(to bottom,black,transparent 88%);
}
body:after { width:420px;height:420px;left:50%;top:45%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(18,112,230,.10);filter:blur(90px); }
#brand {
  position:relative;z-index:1; width:min(880px,calc(100% - 32px)); margin:34px auto 0;
  padding:20px 24px; display:flex;align-items:center;justify-content:space-between;gap:16px;
  border:1px solid var(--line);border-radius:18px 18px 0 0;
  background:linear-gradient(110deg,rgba(14,39,72,.96),rgba(8,21,42,.92));
  box-shadow:0 18px 55px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04);
}
#brand b { color:var(--bright);font-size:18px;font-weight:800;letter-spacing:.13em;text-shadow:0 0 22px rgba(41,156,255,.55); }
#brand b span { color:var(--cyan); }
#brand:after { content:"PS4 KERNEL EXPLOIT";font:10px var(--mono);letter-spacing:.16em;color:var(--dim); }
#ramBox {
  position:relative;z-index:1;width:min(880px,calc(100% - 32px));margin:0 auto;
  padding:10px 24px;border:1px solid var(--line);border-top:0;
  background:rgba(5,16,33,.94);color:var(--ok);font:11px/1.5 var(--mono);
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
}
#spin {
  position:fixed;z-index:2;top:50%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
  border:3px solid rgba(85,180,255,.15);border-top-color:var(--cyan);border-right-color:var(--blue);
  border-radius:50%;animation:spin .85s linear infinite;filter:drop-shadow(0 0 12px rgba(41,156,255,.5));
}
@keyframes spin { to { transform:rotate(360deg); } }
#msg {
  position:fixed;z-index:3;top:50%;left:20px;right:20px;transform:translateY(-50%);
  display:none;text-align:center;font-size:17px;font-weight:700;letter-spacing:.08em;
}
#state,#out { display:none; }
body.done #spin,body.fail #spin { display:none; }
body.fail #msg { display:block;color:var(--bad); }
body.done #msg { display:block;color:var(--ok);font-weight:800;letter-spacing:.18em; }
#wrap { position:relative;z-index:1; }
body.log { display:flex;flex-direction:column;height:100vh;overflow:hidden; }
body.log #brand { flex-shrink:0; }
body.log #ramBox { flex-shrink:0; }
body.log #spin,body.log #msg { display:none; }
body.log #wrap {
  display:flex;flex-direction:column;flex:1;min-height:0;
  width:min(880px,calc(100% - 32px));margin:0 auto 28px;padding:22px 24px 24px;
  border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;
  background:linear-gradient(160deg,rgba(9,25,49,.96),rgba(5,14,29,.96));
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}
body.log #state { display:block;margin:0 0 14px;color:var(--bright);font-size:20px;font-weight:750;letter-spacing:.02em; }
body.log #out {
  display:block;flex:1;min-height:0;overflow-y:auto;padding:16px 18px;
  border:1px solid rgba(75,166,255,.18);border-radius:12px;
  background:rgba(2,9,20,.72);color:#a9c9e9;font:12px/1.65 var(--mono);white-space:pre-wrap;
  box-shadow:inset 0 1px 14px rgba(0,0,0,.24);
}
.notice { margin:1em 0;padding:.8em 1em;border:1px solid #ff6f88;border-radius:10px;background:rgba(90,20,38,.38);color:#ffb1bf;font:700 16px/1.5 var(--sans); }
.byline { position:fixed;bottom:10px;left:0;right:0;margin:0;text-align:center;color:#527397;font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
code { color:var(--cyan); }
@media(max-width:600px) {
  #brand { margin-top:14px;padding:16px;border-radius:14px 14px 0 0; }
  #brand b { font-size:15px;letter-spacing:.09em; }
  #brand:after { font-size:8px;letter-spacing:.08em; }
  #ramBox { padding:9px 16px; }
  body.log #wrap { padding:16px;margin-bottom:22px; }
  body.log #state { font-size:17px; }
}

    </style>
  </head>
  <body>
    <div id="brand"><b>SPLOIT<span>HEN</span> 14.02</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">SploitHen 14.02 · Project by ItsSploited</p>
    <script type="module">
      import "./jb-g.js?v=1402zj";

</html>
